name: Pipeline thematique quotidien

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Executer le pipeline
        run: python -m pipeline.main

      - name: Committer les nouveaux snapshots et rapports
        run: |
          git config user.name "thematic-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement a committer."
          else
            git commit -m "Mise a jour automatique du pipeline thematique ($(date -u +%F))"
            git push
          fi
